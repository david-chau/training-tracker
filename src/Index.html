  page.names.forEach(function (n) { rounds = Math.max(rounds, groups[n].length); });

  for (var r = 0; r < rounds; r++) {
    var round = document.createElement('div');
    round.className = 'round';
    var num = document.createElement('div');
    num.className = 'rnum';
    num.textContent = 'Round ' + (r + 1);
    round.appendChild(num);

    page.names.forEach(function (name, idx) {
      var s = groups[name][r];
      if (!s) return;
      var line = document.createElement('div');
      line.className = 'ssline';
      var who = document.createElement('div');
      who.className = 'sswho';
      who.textContent = name;
      line.appendChild(who);
      var row = setRow(s);
      refreshers[idx].rows.push(row);
      s.onChange = refresh;
      line.appendChild(row);
      round.appendChild(line);
    });
    el.appendChild(round);
  }
  refresh();

  page.names.forEach(function (name) {
    var sets = groups[name];

    // A viewer gets the note as text. It used to get the editor: typing into
    // it looked like it worked, and the write was refused server-side.
    if (!CAN_EDIT) {
      var text = (sets[0] && sets[0].note) || '';
      if (!text) return;
      var block = document.createElement('div');
      var who = document.createElement('div');
      who.className = 'notelabel';
      who.textContent = name;
      var body = document.createElement('div');
      body.className = 'rotext';
      body.textContent = text;
      block.appendChild(who); block.appendChild(body);
      el.appendChild(block);
      return;
    }

    var note = noteField(name, sets);
    note.classList.add('ssnote');
    var label = document.createElement('div');
    label.className = 'notelabel';
    label.textContent = name;
    note.insertBefore(label, note.children[0]);
    el.appendChild(note);
  });

  return el;
}

// The − n sets + control, shared by both kinds of card.
function setCounter(name, sets) {
  var cnt = document.createElement('div');
  cnt.className = 'cnt';
  var minus = document.createElement('button'); minus.textContent = '−';
  var label = document.createElement('span');
  label.textContent = plural(sets.length, 'set');
  var plus = document.createElement('button'); plus.textContent = '+';
  minus.title = sets.length === 1 ? 'Remove ' + name : 'One fewer set';
  minus.onclick = function () { resize(name, sets.length - 1, label); };
  plus.onclick = function () { resize(name, sets.length + 1, label); };
  cnt.appendChild(minus); cnt.appendChild(label); cnt.appendChild(plus);
  return cnt;
}

// Pair with the next page, or unlink. Structural, so it goes through the same
// guards as everything else that moves rows.
function regroup(names, label) {
  if (blockedByQueue()) return;
  var what = label === '' ? 'Unlinking' : 'Making a superset';

  // Pairing is a column J write plus two full reads of the log — five to
  // eight seconds on a real session, which dimmed the whole page and read as
  // a freeze. The pages re-flow here and the write follows, same as an add.
  //
  // The letter is picked locally only so the cards can group now; the server
  // allocates the real one and the response re-renders with it.
  var res = S.lastRes;
  if (res && res.sets) {
    var letter = label === '' ? '' : freeGroup(res.sets);
    res.sets.forEach(function (s) {
      if (names.indexOf(s.exercise) !== -1) s.group = letter;
    });
    S.working = what;
    S.focus = names[0];             // stay on what was just paired or split
    render(res);
  }
  flash(what + '…', false);

  var done = busyGuard(what);
  google.script.run
    .withSuccessHandler(function (r) {
      done(); S.working = null;
      render(r);
      flash(label === '' ? 'Unlinked' : 'Superset created', true);
    })
    .withFailureHandler(function (e) {
      done(); S.working = null;
      flash('Failed: ' + why(e), false, true);
      load(false);            // the sheet is the truth; undo the guess
    })
    .setGroup(KEY, S.day, S.date, names, label);
}

// The first letter this session is not already using.
function freeGroup(sets) {
  var used = {};
  sets.forEach(function (s) { if (s.group) used[s.group] = true; });
  for (var i = 0; i < 26; i++) {
    var letter = String.fromCharCode(65 + i);
    if (!used[letter]) return letter;
  }
  return 'A';
}

function noteField(name, sets) {
  var wrap = document.createElement('div');
  var saved = (sets[0] && sets[0].note) || '';
  var timer = null;

  var box = document.createElement('textarea');
  box.className = 'note';
  box.rows = 2;
  box.placeholder = 'Notes — form cues, niggles, machine setting…';
  box.value = saved;
  box.setAttribute('aria-label', 'Notes for ' + name);

  var row = document.createElement('div');
  row.className = 'noterow';
  var btn = document.createElement('button');
  btn.className = 'notesave';
  btn.textContent = 'Save note';
  var state = document.createElement('span');
  state.className = 'notestate';
  row.appendChild(btn); row.appendChild(state);

  function dirty() {
    var d = box.value !== saved;
    btn.classList.toggle('dirty', d);
    if (d) state.textContent = 'Unsaved';
    return d;
  }

  // Queued like everything else, so a note survives a dropped connection.
  // The button clears as soon as it is queued — the bottom bar owns the
  // "has it reached the sheet yet" question for the whole page.
  function commit(silent) {
    clearTimeout(timer);
    if (!dirty()) return;
    saved = box.value;
    sets.forEach(function (s) { s.note = saved; });

    // A note is written by exercise name to rows that must already exist, so
    // there is nothing to write to until the add lands. Hold it on the sets;
    // absorbAdd carries it across and queues it.
    if (S.adding && S.adding.name === name) {
      btn.classList.remove('dirty');
      state.textContent = 'Queued';
      return;
    }

    var key = queueNote(name, saved);
    watch(key, function (result) { state.textContent = result; });
    btn.classList.remove('dirty');
    state.textContent = 'Queued';
    if (!silent) flash('Note queued', true);
  }

  box.addEventListener('mousedown', function (e) {
    e.stopPropagation();
    window.focus();
    setTimeout(function () { box.focus(); }, 0);
  });
  box.addEventListener('keydown', function (e) { e.stopPropagation(); });
  box.addEventListener('input', function () {
    dirty();
    clearTimeout(timer);
    // The card is about to be re-rendered under a note that has not been
    // committed anywhere, so keep every keystroke on the set objects while an
    // add is in flight rather than waiting out the debounce.
    if (S.adding && S.adding.name === name) {
      sets.forEach(function (s) { s.note = box.value; });
      return;
    }
    timer = setTimeout(function () { commit(true); }, 1500);
  });
  box.onblur = function () { commit(true); };
  btn.onclick = function () { commit(false); };

  wrap.appendChild(box);
  wrap.appendChild(row);

  var prior = S.lastNotes && S.lastNotes[name];
  if (prior) {
    var p = document.createElement('div');
    p.className = 'lastnote';
    p.textContent = 'Last time: ' + prior;
    wrap.appendChild(p);
  }

  return wrap;
}

// Adding, removing and deleting all shift row numbers, which is exactly what
// a queued edit is addressed by. Rather than race, get the queue empty first.
function blockedByQueue() {
  // An add in flight is the same hazard: the server is about to hand back row
  // numbers for rows that do not exist yet. A regroup is the same again — the
  // response it is about to land re-renders the whole session.
  if (S.adding) {
    alert('Still adding ' + S.adding.name + '. Try again in a moment.');
    return true;
  }
  if (S.working) {
    alert(S.working + ' is still saving. Try again in a moment.');
    return true;
  }
  return queueBusy();
}

// Edits waiting to be written are addressed by row, and anything structural
// moves rows. Split out from the guard above because a set count that is
// already changing has to re-check this without complaining about itself.
function queueBusy() {
  if (!pendCount()) return false;
  flush();
  paint();
  alert('Some changes have not saved yet. They are being retried — try this '
        + 'again once the bar at the bottom clears.');
  return true;
}

// How long to wait for more taps before writing a set count. Long enough to
// go from three sets to none in one call, short enough not to feel deferred.
var RESIZE_MS = 800;

// Set counts change on screen and the write follows. Each tap used to be its
// own round trip with the page dimmed for it, so taking an exercise from
// three sets to none meant three waits — on gym wifi, most of a minute.
function resize(exercise, count, label) {
  if (count < 0 || count > 10) return;

  // A resize already under way for this exercise is not a reason to refuse
  // the next tap — it is the same operation continuing.
  var mine = S.resize && S.resize.name === exercise;
  if (mine ? queueBusy() : blockedByQueue()) return;

  // Going below one set is how an exercise is taken out of the session, so it
  // asks first — this deletes rows rather than changing a number.
  if (count === 0 &&
      !confirm('Remove ' + exercise + ' from this session?\n\n' +
               'Its sets are deleted from the sheet.')) {
    return;
  }

  if (!applyResize(exercise, count)) return;
  S.working = count === 0 ? 'Removing ' + exercise : 'Updating sets';
  if (count) S.focus = exercise;
  render(S.lastRes);
  flash(count === 0 ? 'Removing ' + exercise + '…' : 'Sets updated', false);

  if (S.resize) clearTimeout(S.resize.timer);
  S.resize = {
    name: exercise,
    want: count,
    timer: setTimeout(function () { sendResize(); }, RESIZE_MS)
  };
}

// Add or drop set rows in the response already on screen. New rows have no
// row number until the server assigns one, exactly like an optimistic add.
function applyResize(exercise, count) {
  var res = S.lastRes;
  if (!res || !res.sets) return false;

  var mine = res.sets.filter(function (s) { return s.exercise === exercise; });
  if (!mine.length) return false;

  if (count < mine.length) {
    var doomed = mine.slice(count);
    res.sets = res.sets.filter(function (s) { return doomed.indexOf(s) === -1; });
  } else {
    var last = mine[mine.length - 1];
    for (var n = mine.length + 1; n <= count; n++) {
      res.sets.push({
        row: 0, exercise: exercise, set: n, reps: last.reps, weight: last.weight,
        rpe: BLANK, note: last.note, group: last.group, last: null
      });
    }
  }
  return true;
}

function sendResize() {
  var want = S.resize;
  if (!want) return;
  clearTimeout(want.timer);

  var done = busyGuard(S.working || 'Updating sets');
  google.script.run
    .withSuccessHandler(function (res) {
      done();
      // A tap that landed while this was in flight is the newer truth: send
      // it rather than letting the response overwrite it.
      var next = S.resize && S.resize.want !== want.want ? S.resize : null;
      S.resize = next;
      S.working = next ? S.working : null;
      absorbResize(res, want.name);
      render(res);
      if (next) { clearTimeout(next.timer); sendResize(); return; }
      flash(want.want === 0 ? want.name + ' removed' : 'Sets updated', true);
    })
    .withFailureHandler(function (e) {
      done();
      S.resize = null;
      S.working = null;
      flash('Failed: ' + why(e), false, true);
      load(false);              // the sheet is the truth; drop the guess
    })
    .setSetCount(KEY, S.day, S.date, want.name, want.want);
}

// Anything typed into a set that did not exist yet moves onto the row the
// server just created, the same way an added exercise does.
function absorbResize(res, exercise) {
  var shown = (S.lastRes && S.lastRes.sets) || [];
  var dirty = {};
  shown.forEach(function (s) {
    if (s.exercise === exercise && s.dirty && !(s.row > 1)) dirty[s.set] = s;
  });
  if (!Object.keys(dirty).length) return;

  (res.sets || []).forEach(function (t) {
    if (t.exercise !== exercise) return;
    var d = dirty[t.set];
    if (!d) return;
    t.reps = d.reps; t.weight = d.weight; t.rpe = d.rpe;
    queueSave(t);
  });
}

// Column E of the Log means reps for most exercises and seconds for holds
// and carries. Which one is a property of the exercise, so everything that
// renders or steps that field has to ask.
function isTimed(name) { return !!(S.timed && S.timed[name]); }

function amount(name, n) { return isTimed(name) ? n + 's' : String(n); }

// Personal records come from the server with this session excluded, so a
// comparison here answers "better than anything before today". Judged in the
// browser rather than shipped per set, so the star appears the moment a
// weight is typed rather than on the next reload.
function isPr(name, reps, weight) {
  var rec = S.records && S.records[name];
  if (!rec || !(reps > 0)) return false;

  var loaded = weight > 0 || (rec.heaviest && rec.heaviest.weight > 0);
  if (loaded) {
    if (!rec.heaviest) return false;
    if (weight !== rec.heaviest.weight) return weight > rec.heaviest.weight;
    return reps > rec.heaviest.reps;
  }
  return rec.reps ? reps > rec.reps.reps : false;   // unweighted: reps are the record
}

// The record strip. Returns a function that re-checks whether anything on
// the card is currently a personal best, so the tag can appear as a value is
// typed rather than on the next reload.
function metaLine(el, name, sets) {
  var rec = S.records && S.records[name];
  var row = document.createElement('div');
  row.className = 'meta';

  function cell(label, value) {
    var span = document.createElement('span');
    span.appendChild(document.createTextNode(label + ' '));
    var b = document.createElement('b');
    b.textContent = value;
    span.appendChild(b);
    if (row.children.length) {
      var sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = '·';
      row.appendChild(sep);
    }
    row.appendChild(span);
  }

  var t = isTimed(name);
  if (rec && rec.heaviest && rec.heaviest.weight > 0) {
    cell('Best', amount(name, rec.heaviest.reps) + ' × ' + weightText(rec.heaviest.weight));
    // est 1RM is a weight too, and meaningless for a hold.
    if (rec.est1rm && !t) cell('est 1RM', weightText(rec.est1rm));
    cell('on', rec.heaviest.date);
  } else if (rec && rec.reps) {
    cell(t ? 'Longest' : 'Best', t ? amount(name, rec.reps.reps)
                                   : rec.reps.reps + ' reps');
    cell('on', rec.reps.date);
  }

  // "was 12" now comes from the last time this exercise was done rather than
  // from the last session of this day type, so say which date that was when
  // it is not the one the status bar is naming.
  var from = S.lastDates && S.lastDates[name];
  if (from && from !== S.priorDate) cell('last done', from);

  var tag = document.createElement('span');
  tag.className = 'prtag';
  tag.textContent = '★ personal best today';
  tag.hidden = true;
  row.appendChild(tag);

  el.appendChild(row);

  return function (hit) {
    tag.hidden = !hit;
    row.style.display = row.children.length > 1 || hit ? '' : 'none';
  };
}

// A generated session usually beats the old best on *every* set, because the
// whole session steps up together — so marking each qualifying row lit the
// entire card. Mark the one set that actually takes the record instead.
function markPr(name, sets, rows) {
  var winner = -1, best = null;
  sets.forEach(function (s, i) {
    if (!isPr(name, s.reps, s.weight)) return;
    if (!best || beats(s, best)) { best = s; winner = i; }
  });
  rows.forEach(function (row, i) { row.classList.toggle('pr', i === winner); });
  return winner !== -1;
}

// Same order the server uses: heavier wins, and at equal weight more reps or
// seconds wins. Ties keep the earlier set, so the mark does not wander.
function beats(a, b) {
  if (a.weight !== b.weight) return a.weight > b.weight;
  return a.reps > b.reps;
}

function setRow(s) {
  var row = document.createElement('div');
  row.className = 'set';
  var n = document.createElement('div'); n.className = 'n'; n.textContent = s.set;
  row.appendChild(n);
  var t = isTimed(s.exercise);
  row.appendChild(stepper(s, 'reps', t ? 'Seconds' : 'Reps', t ? 5 : 1, 0));
  if (S.noWeight && S.noWeight[s.exercise]) {
    row.classList.add('bw');
  } else {
    // 2.5 of whichever unit is on screen: plates go up in 2.5 kg as readily
    // as in 2.5 lb, so converting the step would only produce ugly numbers.
    row.appendChild(stepper(s, 'weight', 'Weight (' + unitLabel() + ')', 2.5, 1));
  }
  row.appendChild(stepper(s, 'rpe', 'RPE', 0.5, 1));
  return row;
}

// "was 12" under the field it refers to, so the comparison sits next to the
// number being changed rather than summarised at the top of the card.
function wasLine(s, key, dp) {
  var el = document.createElement('div');
  el.className = 'was';
  var prev = s.last && s.last[key];
  if (prev === undefined || prev === null) return el;
  if (key === 'rpe' && prev === BLANK) { el.textContent = 'was —'; return el; }
  if (key === 'weight') prev = toDisplay(prev);
  var shown = Number(prev).toFixed(dp).replace(/\.0$/, '');
  el.textContent = 'was ' + (key === 'reps' ? amount(s.exercise, shown) : shown);
  return el;
}

function stepper(s, key, label, step, dp) {
  var wrap = document.createElement('div');
  wrap.className = 'fld';
  wrap.innerHTML = '<label>' + label + '</label>';

  if (!CAN_EDIT) {
    var ro = document.createElement('div');
    ro.className = 'val';
    var v = s[key];
    if (key === 'weight') v = toDisplay(v);
    ro.textContent = (key === 'rpe' && v === BLANK)
      ? '—' : Number(v).toFixed(dp).replace(/\.0$/, '');
    wrap.appendChild(ro);
    wrap.appendChild(wasLine(s, key, dp));
    return wrap;
  }

  var box = document.createElement('div');
  box.className = 'step';
  var minus = document.createElement('button'); minus.textContent = '−';
  var val = document.createElement('input');
  val.type = 'text';
  val.inputMode = 'decimal';
  val.setAttribute('aria-label', label);
  var plus = document.createElement('button'); plus.textContent = '+';

  // Weights are held in pounds and shown in whichever unit is picked; every
  // other field is the same number either way.
  var isWeight = key === 'weight';
  function view(lb) { return isWeight ? toDisplay(lb) : Number(lb); }
  function stored(shown) { return isWeight ? toPounds(shown) : Number(shown); }

  function show() {
    var v = s[key];
    val.value = (key === 'rpe' && v === BLANK)
      ? '' : view(v).toFixed(dp).replace(/\.0$/, '');
    val.placeholder = (key === 'rpe') ? '—' : '0';
  }

  function clamp(n) {
    if (key === 'rpe') return Math.min(10, Math.max(1, n));
    return Math.max(0, n);
  }

  // Stepping happens in the unit on screen, so kg lands on clean 2.5s rather
  // than on whatever 2.5 lb converts to.
  function bump(delta) {
    var base = (key === 'rpe' && s[key] === BLANK) ? 8 : view(s[key]);
    s[key] = stored(clamp(Math.round((base + delta) / step) * step));
    show(); queueSave(s);
  }

  // Typed entry: accept anything, only normalise when they leave the field.
  // The mousedown handler is deliberate — in a Sheets sidebar the grid can
  // keep keyboard focus, so we claim it explicitly before the caret lands.
  val.addEventListener('mousedown', function (e) {
    e.stopPropagation();
    window.focus();
    setTimeout(function () { val.focus(); val.select(); }, 0);
  });
  val.addEventListener('touchstart', function () {
    setTimeout(function () { val.select(); }, 0);
  }, { passive: true });
  val.addEventListener('keydown', function (e) {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); val.blur(); }
  });
  val.onchange = function () { commit(); };
  val.onblur = function () { commit(); };

  function commit() {
    var raw = val.value.trim();
    if (raw === '') {
      if (key === 'rpe') { s[key] = BLANK; show(); queueSave(s); return; }
      raw = '0';
    }
    var n = parseFloat(raw);
    if (isNaN(n)) { show(); return; }
    var next = stored(clamp(n));
    if (next === Number(s[key])) { show(); return; }
    s[key] = next;
    show(); queueSave(s);
  }

  minus.onclick = function () { bump(-step); };
  plus.onclick = function () { bump(step); };
  box.appendChild(minus); box.appendChild(val); box.appendChild(plus);
  wrap.appendChild(box);
  wrap.appendChild(wasLine(s, key, dp));
  show();
  return wrap;
}

// ---------- pending queue ----------
//
// Gym wifi drops. Every edit goes into a queue first and is replayed until
// the sheet confirms it, so a tap is never lost to a dead connection — the
// worst case is that it saves later.
//
// Entries are keyed by what they overwrite rather than appended, so holding
// down [+] leaves one entry, not fifteen. Replay is safe because each write
// is last-value-wins against a fixed row the server verifies first.

var STORE = 'wl.pending.v1';
var PEND = { items: {}, sending: false, timer: null, saveTimer: null,
             backoff: 1000, note: '', last: null, watchers: {} };

// A note field wants to know when its own write reaches the sheet, so it can
// stop saying "Queued". Registered by pending-key and cleared on every
// render, since the elements they close over are thrown away too.
function watch(key, fn) { PEND.watchers[key] = fn; }

function tellWatcher(key, state) {
  var fn = PEND.watchers[key];
  if (fn) fn(state);
}

// localStorage is not guaranteed inside the Apps Script iframe — some
// browsers partition or block storage for framed content. Without it the
// queue still works for this page view; only surviving a reload is lost,
// and the unload warning covers that case.
var STORAGE = (function () {
  try {
    localStorage.setItem(STORE + '.probe', '1');
    localStorage.removeItem(STORE + '.probe');
    return localStorage;
  } catch (e) { return null; }
})();

function pendKey(it) {
  return it.kind === 'note'
    ? 'n|' + it.day + '|' + it.date + '|' + it.exercise
    : 's|' + it.row;
}

function pendCount() { return Object.keys(PEND.items).length; }

function pendLoad() {
  if (!STORAGE) return;
  try {
    var raw = STORAGE.getItem(STORE);
    if (raw) PEND.items = JSON.parse(raw) || {};
  } catch (e) { PEND.items = {}; }
}

// Serialising the queue and writing localStorage is synchronous, and holding
// a ± button fires this on every press. Debounced so a burst of taps costs one
// write instead of twenty; pendPersistNow() is for the moments that must not
// wait — the queue emptying, and leaving the page.
function pendPersist() {
  if (!STORAGE) return;
  clearTimeout(PEND.saveTimer);
  PEND.saveTimer = setTimeout(pendPersistNow, 250);
}

function pendPersistNow() {
  if (!STORAGE) return;
  clearTimeout(PEND.saveTimer);
  try {
    if (pendCount()) STORAGE.setItem(STORE, JSON.stringify(PEND.items));
    else STORAGE.removeItem(STORE);
  } catch (e) { /* full or blocked — the in-memory queue still works */ }
}

function enqueue(it) {
  var key = pendKey(it);
  PEND.items[key] = it;
  PEND.backoff = 1000;
  pendPersist();
  paint();
  schedule(600);
  return key;
}

function schedule(ms) {
  clearTimeout(PEND.timer);
  PEND.timer = setTimeout(flush, ms);
}

function flush() {
  clearTimeout(PEND.timer);
  if (PEND.sending || !CAN_EDIT) return;

  var keys = Object.keys(PEND.items);
  if (!keys.length) { paint(); return; }

  if (navigator.onLine === false) { PEND.note = 'offline'; paint(); schedule(5000); return; }

  var batch = keys.map(function (k) { return PEND.items[k]; });
  PEND.sending = true;
  PEND.note = 'saving';
  paint();

  // google.script.run can hang rather than fail on a dead connection, so
  // this timeout is what actually gets us back to retrying.
  var settled = false;
  var guard = setTimeout(function () { settle(null, 'timed out'); }, 20000);

  function settle(results, err) {
    if (settled) return;
    settled = true;
    clearTimeout(guard);
    PEND.sending = false;
    if (results) accept(keys, results); else retryLater(err);
  }

  google.script.run
    .withSuccessHandler(function (r) { settle(r || [], null); })
    .withFailureHandler(function (e) { settle(null, (e && e.message) || 'save failed'); })
    .saveBatch(KEY, batch);
}

// Per-item verdicts. A rejected item is permanent — replaying cannot fix a
// row that has moved — so it is dropped and reported rather than retried
// forever against the wrong cell.
function accept(keys, results) {
  var saved = 0, rejected = [];

  keys.forEach(function (k, i) {
    var r = results[i];
    if (!r) return;                       // no verdict: leave queued, try again
    if (r.ok) {
      delete PEND.items[k];
      saved++;
      tellWatcher(k, 'Saved');
      if (r.set) PEND.last = r.set;
    } else {
      delete PEND.items[k];
      tellWatcher(k, 'Failed');
      rejected.push(r.error);
    }
  });

  PEND.backoff = 1000;
  PEND.note = '';
  pendPersistNow();

  if (rejected.length) {
    paint();
    flash('Not saved: ' + rejected[0], false, true);
    load(false);
    return;
  }

  if (pendCount()) { paint(); schedule(300); return; }

  var w = PEND.last;
  paint();
  flash(w ? 'Saved row ' + w.row + ': ' + w.reps + ' x ' + w.weight +
            (w.rpe === BLANK ? '' : ' @ RPE ' + w.rpe)
          : 'Saved ' + saved + (saved === 1 ? ' change' : ' changes'), true);
}

function retryLater(err) {
  PEND.note = err || 'no connection';
  paint();
  PEND.backoff = Math.min(PEND.backoff * 2, 30000);
  schedule(PEND.backoff);
}

function paint() {
  var n = pendCount();
  var bar = document.getElementById('bar');
  var msg = document.getElementById('barmsg');
  document.getElementById('retry').hidden = !n;

  if (!n) { bar.className = 'bar'; return; }

  var what = n + (n === 1 ? ' change' : ' changes') + ' not saved yet';
  msg.textContent =
    PEND.note === 'saving' ? 'Saving ' + n + '…' :
    PEND.note === 'offline' ? what + ' — waiting for a connection' :
    PEND.note ? what + ' — ' + PEND.note + ', retrying' : what;
  bar.className = 'bar pending';
}

// A set on an optimistic card has no row yet — the server assigns those. Its
// edits are held on the object and queued by absorbAdd() once the real rows
// come back, because a queued write is addressed by row and there is nothing
// yet to address.
function queueSave(s) {
  if (s.onChange) s.onChange();
  if (!(s.row > 1)) { s.dirty = true; return; }
  enqueue({
    kind: 'set', row: s.row, exercise: s.exercise, set: s.set,
    reps: s.reps, weight: s.weight, rpe: s.rpe, day: S.day, date: S.date
  });
}

// Move anything typed into the optimistic card onto the rows the server just
// created, and queue those writes. Without this, values entered in the couple
// of seconds an add takes would be overwritten by the response.
function absorbAdd(res) {
  var add = S.adding;
  S.adding = null;
  if (!add) return;

  var dirty = {};
  add.sets.forEach(function (s) { if (s.dirty) dirty[s.set] = s; });
  var note = (add.sets[0] && add.sets[0].note) || '';

  (res.sets || []).forEach(function (t) {
    if (t.exercise !== add.name) return;
    if (note) t.note = note;
    var d = dirty[t.set];
    if (!d) return;
    t.reps = d.reps; t.weight = d.weight; t.rpe = d.rpe;
    queueSave(t);
  });

  if (note) queueNote(add.name, note);
}

function queueNote(exercise, text) {
  return enqueue({ kind: 'note', day: S.day, date: S.date,
                   exercise: exercise, text: text });
}

// Queued values are the truth on screen — a reload must not show the older
// numbers the sheet still holds.
function overlayPending(sets) {
  sets.forEach(function (s) {
    var p = PEND.items['s|' + s.row];
    if (p && p.exercise === s.exercise && p.set === s.set) {
      s.reps = p.reps; s.weight = p.weight; s.rpe = p.rpe;
    }
    var n = PEND.items['n|' + S.day + '|' + S.date + '|' + s.exercise];
    if (n) s.note = n.text;
  });
}

window.addEventListener('online', function () { PEND.backoff = 1000; flush(); });
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && pendCount()) flush();
});
window.addEventListener('beforeunload', function (e) {
  pendPersistNow();          // a debounced write must not be what is lost
  if (!pendCount()) return;
  e.preventDefault();
  e.returnValue = '';
  return '';
});
document.getElementById('retry').onclick = function () { PEND.backoff = 1000; flush(); };

pendLoad();
paint();
if (pendCount()) schedule(500);

function flash(text, ok, bad) {
  // The pending state outranks a transient message — but not a failure, which
  // is the one message the reader has to see. paint() restores the queue's
  // own text on its next event.
  if (pendCount() && !bad) return;
  var bar = document.getElementById('bar');
  document.getElementById('barmsg').textContent = text;
  bar.className = 'bar' + (ok ? ' saved' : '') + (bad ? ' failed' : '');
}
</script>
</body>
</html>
