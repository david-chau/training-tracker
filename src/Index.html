<!DOCTYPE html>
<html>
<head>
<!-- Every link leaves in a new tab. Navigating this page away mid-session
     would take the pending-write queue with it, and localStorage inside the
     Apps Script iframe is not a guarantee we can lean on. Anchors set their
     own target as well; this is the backstop for any added later. -->
<base target="_blank">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --line:#e3e3e0; --muted:#6b6b66; --ink:#1c1c1a; --ok:#1d7a4f; --warn:#a33;
          --link:#1b5aa0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:system-ui,-apple-system,sans-serif; margin:0; padding:16px 16px 64px;
         color:var(--ink); background:#faf9f7; font-size:17px; }
  /* Sticky so the log you are in stays visible however far you scroll —
     with one sheet per person, that is the thing worth never losing. The
     negative margins bleed it past the body padding so nothing shows
     through the gutters when it is stuck. */
  .top { position:sticky; top:0; z-index:5; background:#faf9f7;
         margin:-16px -16px 12px; padding:14px 16px 8px;
         border-bottom:1px solid var(--line); }
  /* Nothing above the session means anything until getBootstrap returns: the
     heading is a placeholder, the date is blank and there are no day buttons.
     Showing that half-built is what made a slow first load look broken. */
  body.booting .datebar,
  body.booting .sessnav,
  body.booting #tools,
  body.booting #days { display:none; }
  body.booting h1 { color:transparent; background:var(--line);
                    border-radius:6px; max-width:11em; }
  body.booting .kicker { visibility:hidden; }
  h1 { font-size:20px; font-weight:600; margin:0 0 2px;
       white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* It opens the spreadsheet, so it should read as a link rather than as a
     heading that happens to respond to taps. */
  h1 a { color:var(--link); text-decoration:underline;
         text-decoration-color:rgba(27,90,160,0.35); text-underline-offset:3px; }
  h1 a::after { content:' \2197'; font-size:0.75em; text-decoration:none;
                display:inline-block; }
  h1 a:hover { text-decoration-color:var(--link); }
  .kicker { font-size:12px; color:var(--muted); letter-spacing:0.06em;
            text-transform:uppercase; margin:0; }
  /* The heading takes the room it needs and the unit picker sits beside it,
     because the unit is a property of the machine you are standing at — it
     has to be reachable without scrolling back up mid-set. */
  .topline { display:flex; align-items:flex-start; gap:10px; }
  .topline > div:first-child { flex:1; min-width:0; }
  .unitpick { display:flex; border:1px solid var(--line); border-radius:8px;
              overflow:hidden; background:#fff; flex:none; }
  .unitpick button { padding:7px 11px; border:0; background:transparent;
                     font-size:13px; font-weight:600; color:var(--muted);
                     cursor:pointer; }
  .unitpick button.on { background:var(--ink); color:#fff; }
  body.booting .unitpick { visibility:hidden; }
  .days { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .day { flex:1; min-width:84px; padding:13px 8px; border:1px solid var(--line);
         background:#fff; border-radius:10px; font-size:17px; cursor:pointer; }
  .day.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .datebar { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  /* Two different kinds of stepping, so they get two different controls:
     the arrows beside the date move one calendar day, these jump to a day
     that actually has a session. One pair of arrows meaning both was the
     confusing part. */
  .sessnav { display:flex; gap:8px; margin-bottom:14px; }
  .sess { flex:1; padding:9px 8px; border:1px solid var(--line); background:#fff;
          border-radius:9px; font-size:13px; font-family:inherit;
          color:var(--muted); cursor:pointer; }
  .sess:disabled { opacity:0.4; cursor:default; }
  .datebar input { flex:1; padding:12px; font-size:16px; border:1px solid var(--line);
                   border-radius:10px; background:#fff; font-family:inherit; }
  .nav { width:44px; height:46px; border:1px solid var(--line); background:#fff;
         border-radius:10px; font-size:18px; cursor:pointer; }
  .ex { background:#fff; border:1px solid var(--line); border-radius:12px;
        padding:14px; margin-bottom:14px; }
  /* On screen before the sheet has it. Entry works; the dashed edge is the
     only sign anything is outstanding. */
  .ex.adding { border-style:dashed; }

  /* One exercise at a time, with the whole session listed above it. The list
     is what a stack of cards gave for free: where you are, what is left, and
     which exercises are paired. */
  .rail { display:flex; flex-direction:column; gap:4px; margin-bottom:12px; }
  .railitem { display:flex; align-items:center; gap:8px; width:100%;
              padding:8px 10px; border:1px solid transparent; border-radius:9px;
              background:transparent; font-size:14px; color:var(--muted);
              text-align:left; cursor:pointer; }
  .railitem.on { background:#fff; border-color:var(--line); color:var(--ink);
                 font-weight:600; }
  .railno { flex:none; width:20px; height:20px; border-radius:50%;
            background:var(--line); color:var(--ink); font-size:12px;
            line-height:20px; text-align:center; }
  .railitem.on .railno { background:var(--ink); color:#fff; }
  .raillabel { flex:1; overflow:hidden; text-overflow:ellipsis;
               white-space:nowrap; }
  .railss { flex:none; font-size:11px; text-transform:uppercase;
            letter-spacing:0.05em; color:var(--muted); }
  .pager { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .pager button { flex:1; padding:13px 8px; border:1px solid var(--line);
                  background:#fff; border-radius:10px; font-size:16px;
                  cursor:pointer; color:var(--ink); }
  .pager button:disabled { color:#c9c7c1; background:#f6f5f2; cursor:default; }
  .pageat { flex:none; font-size:13px; color:var(--muted); min-width:64px;
            text-align:center; }

  /* A superset is one card holding two exercises, rendered in the order they
     are performed: round 1 of both, then round 2. */
  .ex.ss { border-color:var(--ink); }
  .sshead { display:flex; align-items:center; justify-content:space-between;
            margin-bottom:8px; }
  .sstag { font-size:11px; font-weight:600; text-transform:uppercase;
           letter-spacing:0.06em; color:var(--muted); }
  .ssex { margin-bottom:6px; }
  .round { border-top:1px solid var(--line); padding-top:10px; margin-top:10px; }
  .rnum { font-size:12px; text-transform:uppercase; letter-spacing:0.05em;
          color:var(--muted); margin-bottom:6px; }
  .sswho { font-size:14px; font-weight:600; margin:6px 0 2px; }
  .notelabel { font-size:13px; font-weight:600; color:var(--muted);
               margin:12px 0 4px; }
  .link { border:0; background:transparent; color:var(--link); font-size:14px;
          padding:6px 0; cursor:pointer; text-decoration:underline;
          text-decoration-color:rgba(27,90,160,0.35); }
  .pair { margin-top:6px; }
  .exhead { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .title { display:flex; align-items:center; gap:10px; min-width:0; }
  .ex h2 { font-size:17px; font-weight:600; margin:0; }
  .rename { flex:0 0 auto; padding:2px 7px; border:1px solid transparent;
            background:none; border-radius:7px; font-size:13px; cursor:pointer;
            color:var(--muted); font-family:inherit; line-height:1.4; }
  .rename:hover { border-color:var(--line); color:var(--ink); }
  /* Renaming takes the whole card width. Sharing the header row with the set
     counter squeezed the input to a few pixels on a phone, which is where
     renaming is most likely to happen. */
  .namebox { margin-bottom:12px; }
  .namebox input { width:100%; padding:12px; font-size:16px; font-family:inherit;
                   border:1px solid var(--link); border-radius:9px;
                   background:#fff; color:var(--ink); margin-bottom:8px; }
  .namebox .row { display:flex; gap:8px; }
  .howto { flex:0 0 auto; font-size:12px; color:var(--muted); text-decoration:none;
           border:1px solid var(--line); border-radius:999px; padding:3px 10px;
           white-space:nowrap; background:#fff; }
  .howto:hover { color:var(--ink); border-color:var(--muted); }
  .thumb { width:42px; height:42px; flex:0 0 42px; object-fit:cover; border-radius:8px;
           border:1px solid var(--line); background:#f4f3f0; cursor:pointer; }
  .demo { display:block; width:100%; max-width:420px; margin:10px 0 4px;
          border:1px solid var(--line); border-radius:10px; background:#f4f3f0; }
  .ref { font-size:14px; color:var(--muted); margin:2px 0 4px; }
  /* One strip of facts about the exercise, under its name. Everything that
     used to be scattered — the best set, the estimate, the PR marker — reads
     left to right here instead. */
  .meta { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px;
          font-size:13px; color:var(--muted); margin:6px 0 12px; }
  .meta b { color:var(--ink); font-weight:600; }
  .meta .sep { color:var(--line); }
  .meta .prtag { color:#8a6100; background:#fff5d6; border:1px solid #e8d9a8;
                 border-radius:999px; padding:1px 9px; font-size:12px; }
  /* One row per card at most, so this can stay quiet: a faint wash plus a
     star on the set number, which also means the mark does not depend on
     colour alone. */
  .pr .step, .pr .val { background:#fffcf0; }
  .pr .n::after { content:' ★'; color:#b8860b; font-size:12px; }
  .cnt { display:flex; align-items:center; border:1px solid var(--line);
         border-radius:8px; overflow:hidden; flex-shrink:0; }
  .cnt button { width:34px; height:34px; border:0; background:#f4f3f0; font-size:18px;
                cursor:pointer; color:var(--ink); }
  .cnt span { min-width:46px; text-align:center; font-size:13px; color:var(--muted); }
  .set { display:grid; grid-template-columns:18px 1fr 1fr 1fr; gap:6px;
         align-items:end; margin-bottom:14px; }
  .set.bw { grid-template-columns:18px 1fr 1fr; }
  .n { font-size:14px; color:var(--muted); padding-bottom:28px; }
  .fld label { display:block; font-size:11px; color:var(--muted); margin-bottom:3px; }
  /* Last week's value for this field, directly under the field. Always
     rendered, even when empty, so the rows stay aligned. */
  .was { font-size:11px; color:var(--muted); text-align:center;
         margin-top:4px; min-height:14px; font-variant-numeric:tabular-nums; }
  @media (max-width: 430px) {
    .step button { flex:0 0 26px; width:26px; font-size:17px; }
    .step input { font-size:17px; min-width:34px; }
    .set { grid-template-columns:14px 1fr 1fr 1fr; gap:5px; }
    .set.bw { grid-template-columns:14px 1fr 1fr; }
  }
  .step { display:flex; align-items:center; border:1px solid var(--line);
          border-radius:10px; overflow:hidden; background:#fff; }
  .step button { flex:0 0 30px; width:30px; height:46px; border:0; background:#f4f3f0;
                 font-size:19px; line-height:1; cursor:pointer; color:var(--ink); padding:0; }
  .step button:active { background:#e6e5e1; }
  .step input { flex:1 1 auto; width:100%; min-width:38px; border:0; background:transparent;
                text-align:center; font-size:18px; font-family:inherit; padding:0 1px;
                font-variant-numeric:tabular-nums; color:var(--ink); }
  .step input:focus { outline:0; background:#fffbe8; }
  .tools { display:flex; justify-content:space-between; gap:8px; margin-bottom:12px; }
  .addex { width:100%; padding:15px; border:1px dashed var(--line); background:#fff;
           border-radius:10px; font-size:16px; color:var(--muted); cursor:pointer; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:12px;
           padding:14px; margin-bottom:14px; }
  .panel input { width:100%; padding:12px; font-size:16px; border:1px solid var(--line);
                 border-radius:9px; font-family:inherit; margin-bottom:10px; }
  .mini { display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; margin-bottom:12px; }
  /* Reps or seconds. The Exercises tab decides it for a known name; this is
     how a new one gets to say so. */
  .unit { display:flex; gap:0; margin-bottom:12px; border:1px solid var(--line);
          border-radius:9px; overflow:hidden; }
  .unit button { flex:1; padding:10px 8px; border:0; background:#fff;
                 font-size:15px; font-family:inherit; color:var(--muted);
                 cursor:pointer; }
  .unit button.on { background:var(--ink); color:#fff; }
  .unit + .hint { font-size:12px; color:var(--muted); margin:-6px 0 10px; }
  .mini label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .mini input { margin:0; text-align:center; }
  .go { flex:1; padding:13px; border:0; background:var(--ink); color:#fff;
        border-radius:9px; font-size:16px; cursor:pointer; }
  .cancel { flex:1; padding:13px; border:1px solid var(--line); background:#fff;
            border-radius:9px; font-size:16px; cursor:pointer; }
  .danger { padding:8px 14px; border:1px solid var(--line); background:#fff;
            border-radius:8px; font-size:14px; color:var(--warn); cursor:pointer; }
  .start { width:100%; padding:16px; border:0; background:var(--ink); color:#fff;
           border-radius:10px; font-size:17px; cursor:pointer; }
  .choice { width:100%; display:flex; justify-content:space-between; align-items:center;
            gap:12px; padding:15px 16px; margin-bottom:10px; border:1px solid var(--line);
            background:#fff; border-radius:10px; font-size:16px; font-family:inherit;
            color:var(--ink); cursor:pointer; text-align:left; }
  .choice.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
  .choice em { font-style:normal; font-size:13px; color:var(--muted); flex:0 0 auto; }
  .choice.primary em { color:#c9c9c4; }
  .bar { position:fixed; left:0; right:0; bottom:0; z-index:5;
         padding:12px 16px; background:#faf9f7;
         border-top:1px solid var(--line); font-size:14px; color:var(--muted);
         display:flex; align-items:center; gap:10px; }
  .bar span { flex:1; min-width:0; }
  .saved { color:var(--ok); } .failed { color:var(--warn); }
  .bar.pending { background:#fff8e6; border-top-color:#e8d9a8; color:#7a5c14; }
  .retry { flex:0 0 auto; padding:7px 12px; border:1px solid #d8c483; background:#fff;
           border-radius:8px; font-size:13px; font-family:inherit; color:#7a5c14;
           cursor:pointer; }
  .retry[hidden] { display:none; }
  .msg { padding:16px; color:var(--muted); }
  /* Whole-session work only: loading a day, or a structural change that
     rewrites rows. Per-tick saves deliberately stay silent — blocking the
     form on every increment would make entry feel broken. */
  .busy { position:relative; pointer-events:none; opacity:0.55;
          transition:opacity 0.12s ease; }
  .spinner { display:flex; align-items:center; gap:10px;
             padding:16px; color:var(--muted); }
  .spinner::before { content:''; width:15px; height:15px; flex:0 0 15px;
                     border:2px solid var(--line); border-top-color:var(--muted);
                     border-radius:50%; animation:spin 0.7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner::before { animation-duration:2.4s; }
  }
  .ro { display:inline-block; padding:6px 12px; border-radius:8px; background:#eef1ee;
        color:var(--muted); font-size:13px; margin-bottom:12px; }
  .val { display:flex; align-items:center; justify-content:center; height:46px;
         border:1px solid var(--line); border-radius:10px; background:#fff;
         font-size:18px; font-variant-numeric:tabular-nums; }
  .rotext { font-size:15px; color:var(--ink); background:#fdfdfc; padding:10px;
            border:1px solid var(--line); border-radius:9px; margin-top:4px;
            white-space:pre-wrap; }
  .note { width:100%; margin-top:4px; padding:10px; font-family:inherit; font-size:15px;
          border:1px solid var(--line); border-radius:9px; background:#fdfdfc;
          resize:vertical; min-height:42px; color:var(--ink); }
  .note:focus { outline:0; background:#fffbe8; }
  .lastnote { font-size:13px; color:var(--muted); margin-top:8px; font-style:italic; }
  .noterow { display:flex; align-items:center; gap:8px; margin-top:6px; }
  .notesave { padding:8px 16px; border:1px solid var(--line); background:#fff;
              border-radius:8px; font-size:14px; cursor:pointer; color:var(--ink); }
  .notesave.dirty { background:var(--ink); color:#fff; border-color:var(--ink); }
  .notestate { font-size:13px; color:var(--muted); }
</style>
</head>
<body class="booting">

<script>
  var CAN_EDIT = ('<?= canEdit ?>' === 'true');
  var KEY = '<?= editKey ?>';
</script>
<header class="top">
  <div class="topline">
    <div>
      <h1 id="who">Training log</h1>
      <div class="kicker">Training log</div>
    </div>
    <div class="unitpick" id="unit" role="group" aria-label="Weight unit">
      <button type="button" data-unit="lb">lb</button>
      <button type="button" data-unit="kg">kg</button>
    </div>
  </div>
</header>
<div id="robanner"></div>
<div class="datebar">
  <button class="nav" id="dayback" title="Previous day">‹</button>
  <input type="date" id="date">
  <button class="nav" id="dayfwd" title="Next day">›</button>
</div>
<div class="sessnav">
  <button class="sess" id="prevsess">‹ Previous session</button>
  <button class="sess" id="nextsess">Next session ›</button>
</div>
<div class="days" id="days"></div>
<div class="tools" id="tools">
  <button class="danger" id="wipe">Delete this day</button>
</div>
<datalist id="exlist"></datalist>
<div id="body"><div class="spinner">Loading…</div></div>
<div class="bar" id="bar"><span id="barmsg">Ready</span><button class="retry" id="retry" hidden>Retry now</button></div>

<script>
var S = { day:null, date:null, dates:[], page:0, pages:[] };
var BLANK = -1;

// ---------- weight units ----------
//
// The sheet is always pounds — column F is headed "Weight (LB)", records and
// progression compare against it, and a mixed column could not be compared
// with itself. Kilograms are a display choice, converted on the way in and on
// the way out, so switching mid-session changes what you read and type and
// nothing that is stored.
//
// Per device, not per sheet: the toggle is for the machine in front of you.
var LB_PER_KG = 2.20462262;
var UNIT_STORE = 'wl.unit.v1';

function unitLabel() { return S.unit === 'kg' ? 'KG' : 'LB'; }
function toDisplay(lb) {
  return S.unit === 'kg' ? Math.round((Number(lb) / LB_PER_KG) * 10) / 10 : Number(lb);
}
function toPounds(shown) {
  return S.unit === 'kg' ? Math.round(Number(shown) * LB_PER_KG * 10) / 10 : Number(shown);
}
// Reads as a weight wherever one is printed rather than typed.
function weightText(lb) {
  return String(toDisplay(lb)).replace(/\.0$/, '') + ' ' + unitLabel().toLowerCase();
}

S.unit = (function () {
  try { return localStorage.getItem(UNIT_STORE) === 'kg' ? 'kg' : 'lb'; }
  catch (e) { return 'lb'; }
})();

function setUnit(u) {
  S.unit = u === 'kg' ? 'kg' : 'lb';
  try { localStorage.setItem(UNIT_STORE, S.unit); } catch (e) { /* framed storage */ }
  paintUnit();
  // Every weight on screen is now written in the other unit. Values live in
  // the set objects in pounds, so a re-render is all it takes — and it must
  // not touch the sheet or the queue.
  if (S.day && S.date) redraw();
}

function paintUnit() {
  var box = document.getElementById('unit');
  if (!box) return;
  [].forEach.call(box.querySelectorAll('button'), function (b) {
    var mine = b.getAttribute('data-unit') === S.unit;
    b.classList.toggle('on', mine);
    b.setAttribute('aria-pressed', mine ? 'true' : 'false');
  });
}

if (!CAN_EDIT) {
  document.getElementById('tools').style.display = 'none';
  document.getElementById('robanner').innerHTML =
    '<span class="ro">Read only — you can look, not change</span>';
}

google.script.run.withSuccessHandler(function (b) {
  S.date = b.today;
  document.getElementById('date').value = b.today;
  S.images = b.images || {};
  S.videos = b.videos || {};
  S.noWeight = b.noWeight || {};
  S.timed = b.timed || {};
  var who = document.getElementById('who');
  if (b.name) who.textContent = b.name;
  if (b.sheetUrl) {
    var a = document.createElement('a');
    a.href = b.sheetUrl;
    a.target = '_blank';
    a.rel = 'noopener';
    a.title = 'Open the spreadsheet';
    a.textContent = who.textContent;
    who.textContent = '';
    who.appendChild(a);
  }
  var dl = document.getElementById('exlist');
  (b.exercises || []).forEach(function (name) {
    var o = document.createElement('option'); o.value = name; dl.appendChild(o);
  });
  var d = document.getElementById('days');
  b.days.forEach(function (name) {
    var el = document.createElement('button');
    el.className = 'day'; el.textContent = name;
    el.onclick = function () { S.day = name; markDay(); load(false); };
    d.appendChild(el);
  });

  document.body.classList.remove('booting');

  // Land on today's session when there is one — the common case is opening
  // this mid-workout, not browsing.
  if (b.openDay) {
    S.day = b.openDay;
    markDay();
    load(false);
  }

  // A viewer is only offered days that have sessions, so an empty list means
  // there is genuinely nothing to look at yet.
  if (!b.days.length) {
    document.getElementById('body').innerHTML = CAN_EDIT
      ? '<div class="msg">No day types yet — add rows to the Templates tab.</div>'
      : '<div class="msg">Nothing has been logged yet.</div>';
  } else if (!b.openDay) {
    document.getElementById('body').innerHTML =
      '<div class="msg">Pick a day to start.</div>';
  }
}).withFailureHandler(function (e) {
  document.body.classList.remove('booting');
  var body = document.getElementById('body');
  body.innerHTML = '';
  var m = document.createElement('div');
  m.className = 'msg';
  m.textContent = 'Could not load: ' + e.message;
  body.appendChild(m);
}).getBootstrap(KEY);

document.getElementById('date').onchange = function () {
  S.date = this.value; load(false);
};
document.getElementById('wipe').onclick = function () {
  if (!S.day || !S.date) return;
  if (blockedByQueue()) return;
  if (!confirm('Delete every ' + S.day + ' set logged on ' + S.date + '?')) return;
  busy(true, 'Deleting…');
  google.script.run
    .withSuccessHandler(function (n) {
      busy(false);
      flash('Deleted ' + n + ' rows', true);
      load(false);
    })
    .withFailureHandler(function (e) {
      busy(false);
      flash('Delete failed: ' + e.message, false, true);
    })
    .deleteSession(KEY, S.day, S.date);
};

[].forEach.call(document.querySelectorAll('#unit button'), function (b) {
  b.onclick = function () { setUnit(b.getAttribute('data-unit')); };
});
paintUnit();

// Swipe between exercises. Registered once on the page rather than per card,
// since the cards are rebuilt on every load. Deliberately strict: mostly
// horizontal, far enough to be meant, and one finger — a scroll or a pinch
// must not change which exercise is on screen mid-set.
(function () {
  var x0 = 0, y0 = 0, live = false;
  document.addEventListener('touchstart', function (e) {
    live = e.touches.length === 1;
    if (!live) return;
    x0 = e.touches[0].clientX;
    y0 = e.touches[0].clientY;
  }, { passive: true });

  document.addEventListener('touchend', function (e) {
    if (!live) return;
    live = false;
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var dx = t.clientX - x0, dy = t.clientY - y0;
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 2) return;
    showPage(S.page + (dx < 0 ? 1 : -1));
  }, { passive: true });
})();

document.getElementById('dayback').onclick = function () { shiftDay(-1); };
document.getElementById('dayfwd').onclick = function () { shiftDay(1); };
document.getElementById('prevsess').onclick = function () { hop(1); };
document.getElementById('nextsess').onclick = function () { hop(-1); };

// One calendar day, whether or not anything was logged on it.
function shiftDay(n) {
  var p = S.date.split('-');
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  d.setDate(d.getDate() + n);
  S.date = d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate());
  document.getElementById('date').value = S.date;
  load(false);
}

function two(n) { return (n < 10 ? '0' : '') + n; }

// Jump to a date that has a session of this day type. S.dates is newest
// first, so dir = 1 goes back in time.
function hop(dir) {
  if (!S.dates.length) return;
  var i = S.dates.indexOf(S.date);
  var j = (i === -1 ? nearest(dir) : i + dir);
  if (j < 0 || j >= S.dates.length) return;
  S.date = S.dates[j];
  document.getElementById('date').value = S.date;
  load(false);
}

// The current date has no session, so step to the closest one in that
// direction. S.dates is newest first, so going back is the first older entry
// and going forward is the *last* newer one.
function nearest(dir) {
  var found = -1;
  for (var i = 0; i < S.dates.length; i++) {
    if (dir > 0) {
      if (S.dates[i] < S.date) return i;
    } else if (S.dates[i] > S.date) {
      found = i;
    }
  }
  return found;
}

function markSessNav() {
  var back = false, fwd = false;
  if (S.dates.length) {
    var i = S.dates.indexOf(S.date);
    back = i === -1 ? nearest(1) !== -1 : i + 1 < S.dates.length;
    fwd = i === -1 ? nearest(-1) !== -1 : i - 1 >= 0;
  }
  document.getElementById('prevsess').disabled = !back;
  document.getElementById('nextsess').disabled = !fwd;
}

function markDay() {
  [].forEach.call(document.querySelectorAll('.day'), function (b) {
    b.classList.toggle('on', b.textContent === S.day);
  });
}

// Whole-session work: loading a day, or a structural change that rewrites
// rows. Per-tick saves are excluded on purpose — dimming the form on every
// increment would read as the app fighting you.
function busy(on, label) {
  S.busy = !!on;
  var body = document.getElementById('body');
  body.classList.toggle('busy', !!on);
  ['wipe', 'dayback', 'dayfwd'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.disabled = !!on;
  });
  // The session buttons have their own enabled/disabled meaning, so busy
  // disables them but only markSessNav decides when they come back.
  if (on) {
    document.getElementById('prevsess').disabled = true;
    document.getElementById('nextsess').disabled = true;
  } else {
    markSessNav();
  }
  [].forEach.call(document.querySelectorAll('.day'), function (b) {
    b.disabled = !!on;
  });
  if (on && label) flash(label, false);
}

function load(create, source) {
  if (!S.day) return;
  // Leaving the session mid-add would land the response on a different day.
  if (S.adding) { flash('Still adding ' + S.adding.name + ' — one moment', false); return; }
  var body = document.getElementById('body');
  body.classList.remove('busy');
  body.innerHTML = '<div class="spinner">Loading ' + S.day + '…</div>';
  busy(true);
  // Until the date list arrives, hop() has nothing to work with — so the two
  // session buttons stay disabled rather than looking live and doing nothing.
  S.dates = [];
  markSessNav();
  google.script.run.withSuccessHandler(function (d) {
    S.dates = d; markSessNav();
  }).listDates(S.day);
  google.script.run
    .withSuccessHandler(function (res) { busy(false); render(res); })
    .withFailureHandler(function (e) {
      busy(false);
      // Server messages quote sheet values back, so this is text, not markup.
      var body = document.getElementById('body');
      body.innerHTML = '';
      var m = document.createElement('div');
      m.className = 'msg';
      m.textContent = e.message;
      body.appendChild(m);
    })
    .loadSession(S.day, S.date, !!create, KEY, source || 'auto');
}

// Re-render what is already on screen, without asking the server. The set
// objects hold the live values, so switching units costs nothing and cannot
// lose an edit.
function redraw() { if (S.lastRes) render(S.lastRes); }

function render(res) {
  S.lastRes = res;
  var body = document.getElementById('body');
  body.innerHTML = '';

  if (!res.exists) {
    if (!CAN_EDIT) {
      var none = document.createElement('div');
      none.className = 'msg';
      none.textContent = 'No ' + S.day + ' session logged on ' + S.date + '.';
      body.appendChild(none);          // day names come from the sheet
      return;
    }
    body.appendChild(starter(res));
    return;
  }

  if (!res.sets.length) {
    body.insertAdjacentHTML('beforeend',
      '<div class="msg">Empty session. Add the first exercise below — ' +
      'nothing is saved until you do.</div>');
  }

  overlayPending(res.sets);

  var order = [], groups = {};
  res.sets.forEach(function (s) {
    if (!groups[s.exercise]) { groups[s.exercise] = []; order.push(s.exercise); }
    groups[s.exercise].push(s);
  });

  S.lastNotes = res.lastNotes || {};
  S.lastDates = res.lastDates || {};
  S.priorDate = res.priorDate || null;
  S.records = res.records || {};
  PEND.watchers = {};          // the old elements are about to be discarded

  var pages = paginate(order, groups);
  S.pages = pages;
  if (S.page >= pages.length) S.page = Math.max(0, pages.length - 1);

  if (pages.length) body.appendChild(rail(pages));

  pages.forEach(function (page, i) {
    var el = page.group ? supersetCard(page, groups) : card(page.names[0], groups[page.names[0]]);
    el.classList.add('page');
    if (i !== S.page) el.style.display = 'none';
    body.appendChild(el);
  });

  if (pages.length > 1) body.appendChild(pager(pages));
  if (CAN_EDIT) body.appendChild(addExerciseControl());
  flash(res.priorDate ? 'Comparing against ' + res.priorDate : 'First session', false);
  if (!res.sets.length) flash('Empty session', false);
}

// ---------- one exercise at a time ----------
//
// A session is a list of pages: one exercise, or one superset of two or more.
// Everything is rendered and all but the current page hidden, so switching is
// instant and nothing has to be re-created — a card holds live values and
// registered watchers, and rebuilding it mid-session would throw both away.
//
// Order follows the sheet. A superset takes the position of its first member,
// so pairing something added later does not shuffle the session around.
function paginate(order, groups) {
  var pages = [], byGroup = {};
  order.forEach(function (name) {
    var g = (groups[name][0] && groups[name][0].group) || '';
    if (!g) { pages.push({ group: '', names: [name] }); return; }
    if (byGroup[g]) { byGroup[g].names.push(name); return; }
    byGroup[g] = { group: g, names: [name] };
    pages.push(byGroup[g]);
  });
  // A label held by one exercise is not a superset — the server clears these,
  // but a sheet edited by hand can still produce one.
  pages.forEach(function (p) { if (p.names.length < 2) p.group = ''; });
  return pages;
}

function showPage(i) {
  var cards = document.querySelectorAll('.page');
  if (!cards.length) return;
  S.page = Math.max(0, Math.min(cards.length - 1, i));
  [].forEach.call(cards, function (el, n) {
    el.style.display = n === S.page ? '' : 'none';
  });
  paintRail();
  paintPager();
  // The heading is sticky, so this puts the new card under it rather than
  // leaving the reader halfway down the previous one.
  window.scrollTo(0, 0);
}

// The overview: every page at a glance, numbered, with the current one lit.
// Tapping jumps. This is what a stack of cards gave for free and a pager
// takes away — without it there is no way to see the shape of the session.
function rail(pages) {
  var box = document.createElement('div');
  box.className = 'rail';
  box.id = 'rail';

  pages.forEach(function (page, i) {
    var b = document.createElement('button');
    b.className = 'railitem';
    b.setAttribute('data-page', i);

    var n = document.createElement('span');
    n.className = 'railno';
    n.textContent = (i + 1);
    b.appendChild(n);

    var label = document.createElement('span');
    label.className = 'raillabel';
    label.textContent = page.names.join(' + ');
    b.appendChild(label);

    if (page.group) {
      var tag = document.createElement('span');
      tag.className = 'railss';
      tag.textContent = 'superset';
      b.appendChild(tag);
    }

    b.onclick = function () { showPage(i); };
    box.appendChild(b);
  });
  return box;
}

function paintRail() {
  var box = document.getElementById('rail');
  if (!box) return;
  [].forEach.call(box.querySelectorAll('.railitem'), function (b, i) {
    b.classList.toggle('on', i === S.page);
  });
}

function pager(pages) {
  var box = document.createElement('div');
  box.className = 'pager';
  box.id = 'pager';

  var back = document.createElement('button');
  back.id = 'pageback';
  back.textContent = '‹ Previous';
  back.onclick = function () { showPage(S.page - 1); };

  var where = document.createElement('span');
  where.className = 'pageat';
  where.id = 'pageat';

  var fwd = document.createElement('button');
  fwd.id = 'pagefwd';
  fwd.textContent = 'Next ›';
  fwd.onclick = function () { showPage(S.page + 1); };

  box.appendChild(back); box.appendChild(where); box.appendChild(fwd);
  setTimeout(paintPager, 0);
  return box;
}

function paintPager() {
  var at = document.getElementById('pageat');
  if (!at) return;
  var total = (S.pages || []).length;
  at.textContent = (S.page + 1) + ' of ' + total;
  document.getElementById('pageback').disabled = S.page <= 0;
  document.getElementById('pagefwd').disabled = S.page >= total - 1;
}

// Three ways to begin, stated rather than inferred. The app used to pick
// between last week and the template on its own; the rule was sound but
// invisible, and there was no way to overrule it.
function starter(res) {
  var box = document.createElement('div');
  box.insertAdjacentHTML('beforeend',
    '<div class="msg">How should this ' + S.day + ' session on ' + S.date +
    ' start?</div>');

  var opts = [];
  if (res.priorDate) {
    opts.push(['history', 'From last time', res.priorDate + ' + progression']);
  }
  if (res.templateCount) {
    opts.push(['template', 'From the template',
               res.templateCount + (res.templateCount === 1 ? ' exercise' : ' exercises')]);
  }
  opts.push(['empty', 'Empty', 'add as you go']);

  // The blank day defaults to empty; everything else prefers last week.
  if (res.blank) opts.push(opts.shift());

  opts.forEach(function (o, i) {
    var b = document.createElement('button');
    b.className = 'choice' + (i === 0 ? ' primary' : '');
    b.appendChild(document.createTextNode(o[1]));
    var hint = document.createElement('em');
    hint.textContent = o[2];
    b.appendChild(hint);
    b.onclick = function () {
      if (blockedByQueue()) return;
      b.firstChild.nodeValue = 'Building…';
      load(true, o[0]);
    };
    box.appendChild(b);
  });

  return box;
}

function addExerciseControl() {
  var btn = document.createElement('button');
  btn.className = 'addex';
  btn.textContent = '+ Add exercise';
  btn.onclick = function () { btn.replaceWith(addExercisePanel()); };
  return btn;
}

// `prefill` is only used to reopen the panel after the server refused an add,
// so the typed values come back with it.
function addExercisePanel(prefill) {
  var p = document.createElement('div');
  p.className = 'panel';

  var name = document.createElement('input');
  name.setAttribute('list', 'exlist');
  name.placeholder = 'Exercise name';
  name.setAttribute('aria-label', 'Exercise name');
  p.appendChild(name);

  var mini = document.createElement('div');
  mini.className = 'mini';
  var fields = {}, wraps = {};
  [['sets', 'Sets', 3], ['reps', 'Reps', 10],
   ['weight', 'Weight (' + unitLabel() + ')', 0]].forEach(function (f) {
    // label is re-set by syncUnits() once a name is chosen
    var wrap = document.createElement('div');
    wrap.innerHTML = '<label>' + f[1] + '</label>';
    var inp = document.createElement('input');
    inp.type = 'text'; inp.inputMode = 'decimal'; inp.value = f[2];
    inp.setAttribute('aria-label', f[1]);
    wrap.appendChild(inp); mini.appendChild(wrap);
    fields[f[0]] = inp; wraps[f[0]] = wrap;
  });

  // Reps / Seconds toggle. A known exercise sets it from the Exercises tab;
  // touching it afterwards overrides that for this add, and a brand-new name
  // carries the choice into the tab so it sticks.
  var unit = (function () {
    var row = document.createElement('div');
    row.className = 'unit';
    var hint = document.createElement('div');
    hint.className = 'hint';
    var chosen = false, timed = false;

    var reps = document.createElement('button');
    reps.textContent = 'Reps';
    var secs = document.createElement('button');
    secs.textContent = 'Seconds';

    function paint() {
      reps.classList.toggle('on', !timed);
      secs.classList.toggle('on', timed);
      wraps.reps.firstChild.textContent = timed ? 'Seconds' : 'Reps';
      fields.reps.setAttribute('aria-label', timed ? 'Seconds' : 'Reps');
    }
    function pick(t) {
      chosen = true;
      timed = t;
      if (fields.reps.value === (t ? '10' : '30')) fields.reps.value = t ? 30 : 10;
      paint();
      hint.textContent = '';
    }
    reps.onclick = function () { pick(false); };
    secs.onclick = function () { pick(true); };

    row.appendChild(reps); row.appendChild(secs);
    paint();

    return {
      row: row,
      hint: hint,
      timed: function () { return timed; },
      set: pick,
      // Follow the sheet until the user says otherwise.
      suggest: function (nameText) {
        if (chosen) return;
        var known = S.timed && Object.prototype.hasOwnProperty.call(S.timed, nameText);
        timed = isTimed(nameText);
        if (timed && fields.reps.value === '10') fields.reps.value = 30;
        if (!timed && fields.reps.value === '30') fields.reps.value = 10;
        paint();
        hint.textContent = (nameText && known)
          ? nameText + ' is measured in seconds on the Exercises tab'
          : '';
      }
    };
  })();

  p.appendChild(unit.row);
  p.appendChild(unit.hint);
  p.appendChild(mini);
  syncUnits();

  // Asking for the weight of a push-up is the same nonsense here as it was on
  // the card, so the field goes as soon as the name is one that carries none.

  function syncUnits() {
    var chosen = name.value.trim();
    var none = S.noWeight && S.noWeight[chosen];
    wraps.weight.style.display = none ? 'none' : '';
    mini.style.gridTemplateColumns = none ? '1fr 1fr' : '1fr 1fr 1fr';
    if (none) fields.weight.value = 0;
    unit.suggest(chosen);
  }
  name.addEventListener('input', syncUnits);
  name.addEventListener('change', syncUnits);

  if (prefill) {
    name.value = prefill.name;
    unit.set(!!prefill.timed);        // before the numbers: picking rewrites them
    fields.sets.value = prefill.sets;
    fields.reps.value = prefill.reps;
    fields.weight.value = prefill.weight;
    syncUnits();
  }

  var row = document.createElement('div');
  row.style.display = 'flex'; row.style.gap = '8px';
  var go = document.createElement('button');
  go.className = 'go'; go.textContent = 'Add';
  var cancel = document.createElement('button');
  cancel.className = 'cancel'; cancel.textContent = 'Cancel';

  // The card appears immediately and the write happens behind it. An add is a
  // round trip to Apps Script that appends rows and re-reads the whole log —
  // seconds on gym wifi — and blocking the screen for that meant standing at
  // the machine waiting for a spinner before the first set could be entered.
  go.onclick = function () {
    var wanted = name.value.trim();
    if (!wanted) { name.focus(); return; }
    if (blockedByQueue()) return;      // also covers an add already in flight

    var count = Math.max(1, Math.min(10, Math.round(parseFloat(fields.sets.value) || 3)));
    var reps = Math.max(1, Math.round(parseFloat(fields.reps.value) || 10));
    var weight = toPounds(Math.max(0, parseFloat(fields.weight.value) || 0));

    // A name that is new here is not in the bootstrap lookups yet, so record
    // what the panel was told about it — otherwise the optimistic card would
    // render a timed exercise in reps.
    if (unit.timed()) S.timed[wanted] = true;
    if (wraps.weight.style.display === 'none') S.noWeight[wanted] = true;

    var sets = [];
    for (var i = 1; i <= count; i++) {
      sets.push({ row: 0, exercise: wanted, set: i, reps: reps, weight: weight,
                  rpe: BLANK, note: '', last: null });
    }

    var el = card(wanted, sets);
    el.classList.add('adding');
    S.adding = { name: wanted, sets: sets, card: el };
    p.replaceWith(el);
    el.insertAdjacentElement('afterend', addExerciseControl());
    flash('Adding ' + wanted + '…', false);

    // google.script.run can hang rather than fail, and S.adding holds back
    // everything structural while it is set. The server is the truth either
    // way, so a stuck add ends in a reload rather than a wedged page.
    var guard = setTimeout(function () {
      if (!S.adding || S.adding.card !== el) return;
      S.adding = null;
      flash('Add is taking a while — checking the sheet', false);
      load(false);
    }, 25000);

    google.script.run
      .withSuccessHandler(function (res) {
        clearTimeout(guard);
        absorbAdd(res);
        render(res);
        flash('Exercise added', true);
      })
      .withFailureHandler(function (e) {
        clearTimeout(guard);
        S.adding = null;
        el.remove();
        redraw();
        // Put the panel back with what was typed still in it, rather than
        // making them retype an exercise the server refused.
        var ctl = document.querySelector('.addex');
        if (ctl) {
          ctl.replaceWith(addExercisePanel({
            name: wanted, sets: count, reps: reps,
            weight: toDisplay(weight), timed: unit.timed()
          }));
        }
        flash(e.message, false, true);
      })
      .addExercise(KEY, S.day, S.date, wanted, count, reps, weight, unit.timed());
  };
  cancel.onclick = function () { p.replaceWith(addExerciseControl()); };

  row.appendChild(go); row.appendChild(cancel);
  p.appendChild(row);
  setTimeout(function () { name.focus(); }, 50);
  return p;
}

// The name, with a thumbnail in front of it when the Exercises tab supplies
// an image. Tapping it shows the picture full width — for someone who has
// not done the movement before, that is worth more than the name.
function title(name, card) {
  var wrap = document.createElement('div');
  wrap.className = 'title';

  var url = S.images && S.images[name];
  if (url) {
    var thumb = document.createElement('img');
    thumb.className = 'thumb';
    thumb.src = url;
    thumb.alt = '';
    thumb.loading = 'lazy';
    thumb.title = 'Show ' + name;
    thumb.onerror = function () { thumb.remove(); };
    thumb.onclick = function () { toggleDemo(card, name, url); };
    wrap.appendChild(thumb);
  }

  var h2 = document.createElement('h2');
  h2.textContent = name;            // names come from the sheet — never innerHTML
  if (url) {
    h2.style.cursor = 'pointer';
    h2.onclick = function () { toggleDemo(card, name, url); };
  }
  wrap.appendChild(h2);

  if (CAN_EDIT) {
    var ren = document.createElement('button');
    ren.className = 'rename';
    ren.textContent = '✎';
    ren.title = 'Rename ' + name;
    ren.setAttribute('aria-label', 'Rename ' + name);
    ren.onclick = function () { renamePanel(card, name); };
    wrap.appendChild(ren);
  }

  var vid = S.videos && S.videos[name];
  if (vid) {
    var a = document.createElement('a');
    a.className = 'howto';
    a.href = vid;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = '▶ How to';
    a.title = 'How to do ' + name;
    wrap.appendChild(a);
  }
  return wrap;
}

// Swaps the name for an input in place. Renames only within this session —
// the same exercise in earlier sessions keeps its name, because rewriting
// history would change what progression and records were built from.
function renamePanel(card, name) {
  var head = card.querySelector('.exhead');

  var box = document.createElement('div');
  box.className = 'namebox';

  var input = document.createElement('input');
  input.value = name;
  input.setAttribute('list', 'exlist');
  input.setAttribute('aria-label', 'New name for ' + name);

  var row = document.createElement('div');
  row.className = 'row';
  var ok = document.createElement('button');
  ok.className = 'go'; ok.textContent = 'Rename';
  var no = document.createElement('button');
  no.className = 'cancel'; no.textContent = 'Cancel';
  row.appendChild(ok); row.appendChild(no);

  function restore() {
    box.remove();
    if (head) head.style.display = '';
  }

  function commit() {
    var to = input.value.trim();
    if (!to || to === name) return restore();
    if (blockedByQueue()) return;

    ok.disabled = no.disabled = true;
    ok.textContent = 'Renaming…';
    busy(true, 'Renaming ' + name + '…');
    google.script.run
      .withSuccessHandler(function (res) {
        busy(false); render(res); flash('Renamed to ' + to, true);
      })
      .withFailureHandler(function (e) {
        busy(false);
        ok.disabled = no.disabled = false;
        ok.textContent = 'Rename';
        flash(e.message, false, true);
      })
      .renameExercise(KEY, S.day, S.date, name, to);
  }

  ok.onclick = commit;
  no.onclick = restore;
  input.addEventListener('mousedown', function (e) {
    e.stopPropagation();
    window.focus();
    setTimeout(function () { input.focus(); input.select(); }, 0);
  });
  input.addEventListener('keydown', function (e) {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    if (e.key === 'Escape') { e.preventDefault(); restore(); }
  });

  // Hide the header rather than rebuilding it: the set counter and the
  // How-to link come back untouched on cancel.
  if (head) head.style.display = 'none';
  box.appendChild(input);
  box.appendChild(row);
  card.insertBefore(box, card.firstChild);
  setTimeout(function () { input.focus(); input.select(); }, 50);
}

function toggleDemo(card, name, url) {
  var open = card.querySelector('.demo');
  if (open) { open.remove(); return; }

  var img = document.createElement('img');
  img.className = 'demo';
  img.src = url;
  img.alt = name;
  img.onerror = function () {
    img.replaceWith(document.createTextNode(''));
    flash('That image did not load — check the link on the Exercises tab', false, true);
  };
  card.insertBefore(img, card.firstChild.nextSibling);
}

function card(name, sets) {
  var el = document.createElement('div');
  el.className = 'ex';

  var head = document.createElement('div');
  head.className = 'exhead';
  head.appendChild(title(name, el));

  if (!CAN_EDIT) {
    var tag = document.createElement('span');
    tag.className = 'notestate';
    tag.textContent = sets.length + ' sets';
    head.appendChild(tag);
    el.appendChild(head);
    var setTagRo = metaLine(el, name, sets);
    var roRows = [];
    sets.forEach(function (x) {
      var row = setRow(x);
      roRows.push(row);
      el.appendChild(row);
    });
    setTagRo(markPr(name, sets, roRows));
    if (sets[0] && sets[0].note) {
      el.insertAdjacentHTML('beforeend', '<div class="rotext"></div>');
      el.lastChild.textContent = sets[0].note;
    }
    return el;
  }

  head.appendChild(setCounter(name, sets));
  el.appendChild(head);

  var setTag = metaLine(el, name, sets);
  var rows = [];

  function refresh() { setTag(markPr(name, sets, rows)); }

  sets.forEach(function (s) {
    var row = setRow(s);
    rows.push(row);
    s.onChange = refresh;
    el.appendChild(row);
  });
  refresh();

  el.appendChild(noteField(name, sets));
  el.appendChild(pairControl(name));
  return el;
}

// Offered on a plain exercise when there is a following page to pair with —
// which is how a superset gets made, since the two have to be next to each
// other to be performed back to back.
function pairControl(name) {
  var wrap = document.createElement('div');
  if (!CAN_EDIT) return wrap;

  var pages = S.pages || [];
  var here = -1;
  pages.forEach(function (p, i) { if (p.names.indexOf(name) !== -1) here = i; });
  var next = pages[here + 1];
  if (here === -1 || !next) return wrap;

  var b = document.createElement('button');
  b.className = 'link pair';
  b.textContent = '⇄ Superset with ' + next.names.join(' + ');
  b.onclick = function () { regroup([name].concat(next.names), 'new'); };
  wrap.appendChild(b);
  return wrap;
}

// A superset, rendered in the order it is performed: round 1 of everything,
// then round 2. Grouping each exercise's sets together instead would put the
// two halves at opposite ends of the card, which is the scrolling the pages
// were meant to remove.
//
// Set counts may differ between halves — three of one and two of the other is
// a normal way to finish — so a round only shows the exercises that have a
// set that far in.
function supersetCard(page, groups) {
  var el = document.createElement('div');
  el.className = 'ex ss';

  var head = document.createElement('div');
  head.className = 'sshead';
  var tag = document.createElement('span');
  tag.className = 'sstag';
  tag.textContent = 'Superset';
  head.appendChild(tag);

  if (CAN_EDIT) {
    var cut = document.createElement('button');
    cut.className = 'link';
    cut.textContent = 'Unlink';
    cut.onclick = function () { regroup(page.names, ''); };
    head.appendChild(cut);
  }
  el.appendChild(head);

  // One header block per exercise: name, records, and its own set counter.
  var refreshers = [];
  page.names.forEach(function (name) {
    var sets = groups[name];
    var block = document.createElement('div');
    block.className = 'ssex';

    var line = document.createElement('div');
    line.className = 'exhead';
    line.appendChild(title(name, el));
    if (CAN_EDIT) line.appendChild(setCounter(name, sets));
    block.appendChild(line);

    var setTag = metaLine(block, name, sets);
    el.appendChild(block);
    refreshers.push({ name: name, sets: sets, rows: [], tag: setTag });
  });

  function refresh() {
    refreshers.forEach(function (r) { r.tag(markPr(r.name, r.sets, r.rows)); });
  }

  var rounds = 0;
  page.names.forEach(function (n) { rounds = Math.max(rounds, groups[n].length); });

  for (var r = 0; r < rounds; r++) {
    var round = document.createElement('div');
    round.className = 'round';
    var num = document.createElement('div');
    num.className = 'rnum';
    num.textContent = 'Round ' + (r + 1);
    round.appendChild(num);

    page.names.forEach(function (name, idx) {
      var s = groups[name][r];
      if (!s) return;
      var line = document.createElement('div');
      line.className = 'ssline';
      var who = document.createElement('div');
      who.className = 'sswho';
      who.textContent = name;
      line.appendChild(who);
      var row = setRow(s);
      refreshers[idx].rows.push(row);
      s.onChange = refresh;
      line.appendChild(row);
      round.appendChild(line);
    });
    el.appendChild(round);
  }
  refresh();

  page.names.forEach(function (name) {
    var note = noteField(name, groups[name]);
    note.classList.add('ssnote');
    var label = document.createElement('div');
    label.className = 'notelabel';
    label.textContent = name;
    note.insertBefore(label, note.children[0]);
    el.appendChild(note);
  });

  return el;
}

// The − n sets + control, shared by both kinds of card.
function setCounter(name, sets) {
  var cnt = document.createElement('div');
  cnt.className = 'cnt';
  var minus = document.createElement('button'); minus.textContent = '−';
  var label = document.createElement('span'); label.textContent = sets.length + ' sets';
  var plus = document.createElement('button'); plus.textContent = '+';
  minus.title = sets.length === 1 ? 'Remove ' + name : 'One fewer set';
  minus.onclick = function () { resize(name, sets.length - 1, label); };
  plus.onclick = function () { resize(name, sets.length + 1, label); };
  cnt.appendChild(minus); cnt.appendChild(label); cnt.appendChild(plus);
  return cnt;
}

// Pair with the next page, or unlink. Structural, so it goes through the same
// guards as everything else that moves rows.
function regroup(names, label) {
  if (blockedByQueue()) return;
  busy(true, label === '' ? 'Unlinking…' : 'Making a superset…');
  google.script.run
    .withSuccessHandler(function (res) {
      busy(false);
      render(res);
      flash(label === '' ? 'Unlinked' : 'Superset created', true);
    })
    .withFailureHandler(function (e) {
      busy(false);
      flash('Failed: ' + e.message, false, true);
    })
    .setGroup(KEY, S.day, S.date, names, label);
}

function noteField(name, sets) {
  var wrap = document.createElement('div');
  var saved = (sets[0] && sets[0].note) || '';
  var timer = null;

  var box = document.createElement('textarea');
  box.className = 'note';
  box.rows = 2;
  box.placeholder = 'Notes — form cues, niggles, machine setting…';
  box.value = saved;
  box.setAttribute('aria-label', 'Notes for ' + name);

  var row = document.createElement('div');
  row.className = 'noterow';
  var btn = document.createElement('button');
  btn.className = 'notesave';
  btn.textContent = 'Save note';
  var state = document.createElement('span');
  state.className = 'notestate';
  row.appendChild(btn); row.appendChild(state);

  function dirty() {
    var d = box.value !== saved;
    btn.classList.toggle('dirty', d);
    if (d) state.textContent = 'Unsaved';
    return d;
  }

  // Queued like everything else, so a note survives a dropped connection.
  // The button clears as soon as it is queued — the bottom bar owns the
  // "has it reached the sheet yet" question for the whole page.
  function commit(silent) {
    clearTimeout(timer);
    if (!dirty()) return;
    saved = box.value;
    sets.forEach(function (s) { s.note = saved; });

    // A note is written by exercise name to rows that must already exist, so
    // there is nothing to write to until the add lands. Hold it on the sets;
    // absorbAdd carries it across and queues it.
    if (S.adding && S.adding.name === name) {
      btn.classList.remove('dirty');
      state.textContent = 'Queued';
      return;
    }

    var key = queueNote(name, saved);
    watch(key, function (result) { state.textContent = result; });
    btn.classList.remove('dirty');
    state.textContent = 'Queued';
    if (!silent) flash('Note queued', true);
  }

  box.addEventListener('mousedown', function (e) {
    e.stopPropagation();
    window.focus();
    setTimeout(function () { box.focus(); }, 0);
  });
  box.addEventListener('keydown', function (e) { e.stopPropagation(); });
  box.addEventListener('input', function () {
    dirty();
    clearTimeout(timer);
    // The card is about to be re-rendered under a note that has not been
    // committed anywhere, so keep every keystroke on the set objects while an
    // add is in flight rather than waiting out the debounce.
    if (S.adding && S.adding.name === name) {
      sets.forEach(function (s) { s.note = box.value; });
      return;
    }
    timer = setTimeout(function () { commit(true); }, 1500);
  });
  box.onblur = function () { commit(true); };
  btn.onclick = function () { commit(false); };

  wrap.appendChild(box);
  wrap.appendChild(row);

  var prior = S.lastNotes && S.lastNotes[name];
  if (prior) {
    var p = document.createElement('div');
    p.className = 'lastnote';
    p.textContent = 'Last time: ' + prior;
    wrap.appendChild(p);
  }

  return wrap;
}

// Adding, removing and deleting all shift row numbers, which is exactly what
// a queued edit is addressed by. Rather than race, get the queue empty first.
function blockedByQueue() {
  // An add in flight is the same hazard: the server is about to hand back row
  // numbers for rows that do not exist yet.
  if (S.adding) {
    alert('Still adding ' + S.adding.name + '. Try again in a moment.');
    return true;
  }
  if (!pendCount()) return false;
  flush();
  paint();
  alert('Some changes have not saved yet. They are being retried — try this '
        + 'again once the bar at the bottom clears.');
  return true;
}

function resize(exercise, count, label) {
  if (count < 0 || count > 10) return;
  if (blockedByQueue()) return;

  // Going below one set is how an exercise is taken out of the session, so
  // it asks first — this deletes rows rather than changing a number.
  if (count === 0 &&
      !confirm('Remove ' + exercise + ' from this session?\n\n' +
               'Its sets are deleted from the sheet.')) {
    return;
  }

  label.textContent = '…';
  busy(true, count === 0 ? 'Removing ' + exercise + '…' : 'Updating sets…');
  google.script.run
    .withSuccessHandler(function (res) {
      busy(false);
      render(res);
      flash(count === 0 ? exercise + ' removed' : 'Sets updated', true);
    })
    .withFailureHandler(function (e) {
      busy(false);
      flash('Failed: ' + e.message, false, true);
    })
    .setSetCount(KEY, S.day, S.date, exercise, count);
}

// Column E of the Log means reps for most exercises and seconds for holds
// and carries. Which one is a property of the exercise, so everything that
// renders or steps that field has to ask.
function isTimed(name) { return !!(S.timed && S.timed[name]); }

function amount(name, n) { return isTimed(name) ? n + 's' : String(n); }

// Personal records come from the server with this session excluded, so a
// comparison here answers "better than anything before today". Judged in the
// browser rather than shipped per set, so the star appears the moment a
// weight is typed rather than on the next reload.
function isPr(name, reps, weight) {
  var rec = S.records && S.records[name];
  if (!rec || !(reps > 0)) return false;

  var loaded = weight > 0 || (rec.heaviest && rec.heaviest.weight > 0);
  if (loaded) {
    if (!rec.heaviest) return false;
    if (weight !== rec.heaviest.weight) return weight > rec.heaviest.weight;
    return reps > rec.heaviest.reps;
  }
  return rec.reps ? reps > rec.reps.reps : false;   // unweighted: reps are the record
}

// The record strip. Returns a function that re-checks whether anything on
// the card is currently a personal best, so the tag can appear as a value is
// typed rather than on the next reload.
function metaLine(el, name, sets) {
  var rec = S.records && S.records[name];
  var row = document.createElement('div');
  row.className = 'meta';

  function cell(label, value) {
    var span = document.createElement('span');
    span.appendChild(document.createTextNode(label + ' '));
    var b = document.createElement('b');
    b.textContent = value;
    span.appendChild(b);
    if (row.children.length) {
      var sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = '·';
      row.appendChild(sep);
    }
    row.appendChild(span);
  }

  var t = isTimed(name);
  if (rec && rec.heaviest && rec.heaviest.weight > 0) {
    cell('Best', amount(name, rec.heaviest.reps) + ' × ' + weightText(rec.heaviest.weight));
    // est 1RM is a weight too, and meaningless for a hold.
    if (rec.est1rm && !t) cell('est 1RM', weightText(rec.est1rm));
    cell('on', rec.heaviest.date);
  } else if (rec && rec.reps) {
    cell(t ? 'Longest' : 'Best', t ? amount(name, rec.reps.reps)
                                   : rec.reps.reps + ' reps');
    cell('on', rec.reps.date);
  }

  // "was 12" now comes from the last time this exercise was done rather than
  // from the last session of this day type, so say which date that was when
  // it is not the one the status bar is naming.
  var from = S.lastDates && S.lastDates[name];
  if (from && from !== S.priorDate) cell('last done', from);

  var tag = document.createElement('span');
  tag.className = 'prtag';
  tag.textContent = '★ personal best today';
  tag.hidden = true;
  row.appendChild(tag);

  el.appendChild(row);

  return function (hit) {
    tag.hidden = !hit;
    row.style.display = row.children.length > 1 || hit ? '' : 'none';
  };
}

// A generated session usually beats the old best on *every* set, because the
// whole session steps up together — so marking each qualifying row lit the
// entire card. Mark the one set that actually takes the record instead.
function markPr(name, sets, rows) {
  var winner = -1, best = null;
  sets.forEach(function (s, i) {
    if (!isPr(name, s.reps, s.weight)) return;
    if (!best || beats(s, best)) { best = s; winner = i; }
  });
  rows.forEach(function (row, i) { row.classList.toggle('pr', i === winner); });
  return winner !== -1;
}

// Same order the server uses: heavier wins, and at equal weight more reps or
// seconds wins. Ties keep the earlier set, so the mark does not wander.
function beats(a, b) {
  if (a.weight !== b.weight) return a.weight > b.weight;
  return a.reps > b.reps;
}

function setRow(s) {
  var row = document.createElement('div');
  row.className = 'set';
  var n = document.createElement('div'); n.className = 'n'; n.textContent = s.set;
  row.appendChild(n);
  var t = isTimed(s.exercise);
  row.appendChild(stepper(s, 'reps', t ? 'Seconds' : 'Reps', t ? 5 : 1, 0));
  if (S.noWeight && S.noWeight[s.exercise]) {
    row.classList.add('bw');
  } else {
    // 2.5 of whichever unit is on screen: plates go up in 2.5 kg as readily
    // as in 2.5 lb, so converting the step would only produce ugly numbers.
    row.appendChild(stepper(s, 'weight', 'Weight (' + unitLabel() + ')', 2.5, 1));
  }
  row.appendChild(stepper(s, 'rpe', 'RPE', 0.5, 1));
  return row;
}

// "was 12" under the field it refers to, so the comparison sits next to the
// number being changed rather than summarised at the top of the card.
function wasLine(s, key, dp) {
  var el = document.createElement('div');
  el.className = 'was';
  var prev = s.last && s.last[key];
  if (prev === undefined || prev === null) return el;
  if (key === 'rpe' && prev === BLANK) { el.textContent = 'was —'; return el; }
  if (key === 'weight') prev = toDisplay(prev);
  var shown = Number(prev).toFixed(dp).replace(/\.0$/, '');
  el.textContent = 'was ' + (key === 'reps' ? amount(s.exercise, shown) : shown);
  return el;
}

function stepper(s, key, label, step, dp) {
  var wrap = document.createElement('div');
  wrap.className = 'fld';
  wrap.innerHTML = '<label>' + label + '</label>';

  if (!CAN_EDIT) {
    var ro = document.createElement('div');
    ro.className = 'val';
    var v = s[key];
    if (key === 'weight') v = toDisplay(v);
    ro.textContent = (key === 'rpe' && v === BLANK)
      ? '—' : Number(v).toFixed(dp).replace(/\.0$/, '');
    wrap.appendChild(ro);
    wrap.appendChild(wasLine(s, key, dp));
    return wrap;
  }

  var box = document.createElement('div');
  box.className = 'step';
  var minus = document.createElement('button'); minus.textContent = '−';
  var val = document.createElement('input');
  val.type = 'text';
  val.inputMode = 'decimal';
  val.setAttribute('aria-label', label);
  var plus = document.createElement('button'); plus.textContent = '+';

  // Weights are held in pounds and shown in whichever unit is picked; every
  // other field is the same number either way.
  var isWeight = key === 'weight';
  function view(lb) { return isWeight ? toDisplay(lb) : Number(lb); }
  function stored(shown) { return isWeight ? toPounds(shown) : Number(shown); }

  function show() {
    var v = s[key];
    val.value = (key === 'rpe' && v === BLANK)
      ? '' : view(v).toFixed(dp).replace(/\.0$/, '');
    val.placeholder = (key === 'rpe') ? '—' : '0';
  }

  function clamp(n) {
    if (key === 'rpe') return Math.min(10, Math.max(1, n));
    return Math.max(0, n);
  }

  // Stepping happens in the unit on screen, so kg lands on clean 2.5s rather
  // than on whatever 2.5 lb converts to.
  function bump(delta) {
    var base = (key === 'rpe' && s[key] === BLANK) ? 8 : view(s[key]);
    s[key] = stored(clamp(Math.round((base + delta) / step) * step));
    show(); queueSave(s);
  }

  // Typed entry: accept anything, only normalise when they leave the field.
  // The mousedown handler is deliberate — in a Sheets sidebar the grid can
  // keep keyboard focus, so we claim it explicitly before the caret lands.
  val.addEventListener('mousedown', function (e) {
    e.stopPropagation();
    window.focus();
    setTimeout(function () { val.focus(); val.select(); }, 0);
  });
  val.addEventListener('touchstart', function () {
    setTimeout(function () { val.select(); }, 0);
  }, { passive: true });
  val.addEventListener('keydown', function (e) {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); val.blur(); }
  });
  val.onchange = function () { commit(); };
  val.onblur = function () { commit(); };

  function commit() {
    var raw = val.value.trim();
    if (raw === '') {
      if (key === 'rpe') { s[key] = BLANK; show(); queueSave(s); return; }
      raw = '0';
    }
    var n = parseFloat(raw);
    if (isNaN(n)) { show(); return; }
    var next = stored(clamp(n));
    if (next === Number(s[key])) { show(); return; }
    s[key] = next;
    show(); queueSave(s);
  }

  minus.onclick = function () { bump(-step); };
  plus.onclick = function () { bump(step); };
  box.appendChild(minus); box.appendChild(val); box.appendChild(plus);
  wrap.appendChild(box);
  wrap.appendChild(wasLine(s, key, dp));
  show();
  return wrap;
}

// ---------- pending queue ----------
//
// Gym wifi drops. Every edit goes into a queue first and is replayed until
// the sheet confirms it, so a tap is never lost to a dead connection — the
// worst case is that it saves later.
//
// Entries are keyed by what they overwrite rather than appended, so holding
// down [+] leaves one entry, not fifteen. Replay is safe because each write
// is last-value-wins against a fixed row the server verifies first.

var STORE = 'wl.pending.v1';
var PEND = { items: {}, sending: false, timer: null, saveTimer: null,
             backoff: 1000, note: '', last: null, watchers: {} };

// A note field wants to know when its own write reaches the sheet, so it can
// stop saying "Queued". Registered by pending-key and cleared on every
// render, since the elements they close over are thrown away too.
function watch(key, fn) { PEND.watchers[key] = fn; }

function tellWatcher(key, state) {
  var fn = PEND.watchers[key];
  if (fn) fn(state);
}

// localStorage is not guaranteed inside the Apps Script iframe — some
// browsers partition or block storage for framed content. Without it the
// queue still works for this page view; only surviving a reload is lost,
// and the unload warning covers that case.
var STORAGE = (function () {
  try {
    localStorage.setItem(STORE + '.probe', '1');
    localStorage.removeItem(STORE + '.probe');
    return localStorage;
  } catch (e) { return null; }
})();

function pendKey(it) {
  return it.kind === 'note'
    ? 'n|' + it.day + '|' + it.date + '|' + it.exercise
    : 's|' + it.row;
}

function pendCount() { return Object.keys(PEND.items).length; }

function pendLoad() {
  if (!STORAGE) return;
  try {
    var raw = STORAGE.getItem(STORE);
    if (raw) PEND.items = JSON.parse(raw) || {};
  } catch (e) { PEND.items = {}; }
}

// Serialising the queue and writing localStorage is synchronous, and holding
// a ± button fires this on every press. Debounced so a burst of taps costs one
// write instead of twenty; pendPersistNow() is for the moments that must not
// wait — the queue emptying, and leaving the page.
function pendPersist() {
  if (!STORAGE) return;
  clearTimeout(PEND.saveTimer);
  PEND.saveTimer = setTimeout(pendPersistNow, 250);
}

function pendPersistNow() {
  if (!STORAGE) return;
  clearTimeout(PEND.saveTimer);
  try {
    if (pendCount()) STORAGE.setItem(STORE, JSON.stringify(PEND.items));
    else STORAGE.removeItem(STORE);
  } catch (e) { /* full or blocked — the in-memory queue still works */ }
}

function enqueue(it) {
  var key = pendKey(it);
  PEND.items[key] = it;
  PEND.backoff = 1000;
  pendPersist();
  paint();
  schedule(600);
  return key;
}

function schedule(ms) {
  clearTimeout(PEND.timer);
  PEND.timer = setTimeout(flush, ms);
}

function flush() {
  clearTimeout(PEND.timer);
  if (PEND.sending || !CAN_EDIT) return;

  var keys = Object.keys(PEND.items);
  if (!keys.length) { paint(); return; }

  if (navigator.onLine === false) { PEND.note = 'offline'; paint(); schedule(5000); return; }

  var batch = keys.map(function (k) { return PEND.items[k]; });
  PEND.sending = true;
  PEND.note = 'saving';
  paint();

  // google.script.run can hang rather than fail on a dead connection, so
  // this timeout is what actually gets us back to retrying.
  var settled = false;
  var guard = setTimeout(function () { settle(null, 'timed out'); }, 20000);

  function settle(results, err) {
    if (settled) return;
    settled = true;
    clearTimeout(guard);
    PEND.sending = false;
    if (results) accept(keys, results); else retryLater(err);
  }

  google.script.run
    .withSuccessHandler(function (r) { settle(r || [], null); })
    .withFailureHandler(function (e) { settle(null, (e && e.message) || 'save failed'); })
    .saveBatch(KEY, batch);
}

// Per-item verdicts. A rejected item is permanent — replaying cannot fix a
// row that has moved — so it is dropped and reported rather than retried
// forever against the wrong cell.
function accept(keys, results) {
  var saved = 0, rejected = [];

  keys.forEach(function (k, i) {
    var r = results[i];
    if (!r) return;                       // no verdict: leave queued, try again
    if (r.ok) {
      delete PEND.items[k];
      saved++;
      tellWatcher(k, 'Saved');
      if (r.set) PEND.last = r.set;
    } else {
      delete PEND.items[k];
      tellWatcher(k, 'Failed');
      rejected.push(r.error);
    }
  });

  PEND.backoff = 1000;
  PEND.note = '';
  pendPersistNow();

  if (rejected.length) {
    paint();
    flash('Not saved: ' + rejected[0], false, true);
    load(false);
    return;
  }

  if (pendCount()) { paint(); schedule(300); return; }

  var w = PEND.last;
  paint();
  flash(w ? 'Saved row ' + w.row + ': ' + w.reps + ' x ' + w.weight +
            (w.rpe === BLANK ? '' : ' @ RPE ' + w.rpe)
          : 'Saved ' + saved + (saved === 1 ? ' change' : ' changes'), true);
}

function retryLater(err) {
  PEND.note = err || 'no connection';
  paint();
  PEND.backoff = Math.min(PEND.backoff * 2, 30000);
  schedule(PEND.backoff);
}

function paint() {
  var n = pendCount();
  var bar = document.getElementById('bar');
  var msg = document.getElementById('barmsg');
  document.getElementById('retry').hidden = !n;

  if (!n) { bar.className = 'bar'; return; }

  var what = n + (n === 1 ? ' change' : ' changes') + ' not saved yet';
  msg.textContent =
    PEND.note === 'saving' ? 'Saving ' + n + '…' :
    PEND.note === 'offline' ? what + ' — waiting for a connection' :
    PEND.note ? what + ' — ' + PEND.note + ', retrying' : what;
  bar.className = 'bar pending';
}

// A set on an optimistic card has no row yet — the server assigns those. Its
// edits are held on the object and queued by absorbAdd() once the real rows
// come back, because a queued write is addressed by row and there is nothing
// yet to address.
function queueSave(s) {
  if (s.onChange) s.onChange();
  if (!(s.row > 1)) { s.dirty = true; return; }
  enqueue({
    kind: 'set', row: s.row, exercise: s.exercise, set: s.set,
    reps: s.reps, weight: s.weight, rpe: s.rpe, day: S.day, date: S.date
  });
}

// Move anything typed into the optimistic card onto the rows the server just
// created, and queue those writes. Without this, values entered in the couple
// of seconds an add takes would be overwritten by the response.
function absorbAdd(res) {
  var add = S.adding;
  S.adding = null;
  if (!add) return;

  var dirty = {};
  add.sets.forEach(function (s) { if (s.dirty) dirty[s.set] = s; });
  var note = (add.sets[0] && add.sets[0].note) || '';

  (res.sets || []).forEach(function (t) {
    if (t.exercise !== add.name) return;
    if (note) t.note = note;
    var d = dirty[t.set];
    if (!d) return;
    t.reps = d.reps; t.weight = d.weight; t.rpe = d.rpe;
    queueSave(t);
  });

  if (note) queueNote(add.name, note);
}

function queueNote(exercise, text) {
  return enqueue({ kind: 'note', day: S.day, date: S.date,
                   exercise: exercise, text: text });
}

// Queued values are the truth on screen — a reload must not show the older
// numbers the sheet still holds.
function overlayPending(sets) {
  sets.forEach(function (s) {
    var p = PEND.items['s|' + s.row];
    if (p && p.exercise === s.exercise && p.set === s.set) {
      s.reps = p.reps; s.weight = p.weight; s.rpe = p.rpe;
    }
    var n = PEND.items['n|' + S.day + '|' + S.date + '|' + s.exercise];
    if (n) s.note = n.text;
  });
}

window.addEventListener('online', function () { PEND.backoff = 1000; flush(); });
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && pendCount()) flush();
});
window.addEventListener('beforeunload', function (e) {
  pendPersistNow();          // a debounced write must not be what is lost
  if (!pendCount()) return;
  e.preventDefault();
  e.returnValue = '';
  return '';
});
document.getElementById('retry').onclick = function () { PEND.backoff = 1000; flush(); };

pendLoad();
paint();
if (pendCount()) schedule(500);

function flash(text, ok, bad) {
  if (pendCount()) return;          // the pending state outranks a transient message
  var bar = document.getElementById('bar');
  document.getElementById('barmsg').textContent = text;
  bar.className = 'bar' + (ok ? ' saved' : '') + (bad ? ' failed' : '');
}
</script>
</body>
</html>
